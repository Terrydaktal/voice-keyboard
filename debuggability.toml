schema_version = 6
template = false
profile = "stateful"
owner = "Terrydaktal"
expected_failure_modes = [
  "Rambler S3 HTTP/2 stream premature EOF or non-zero gRPC trailer status returning empty transcript",
  "Rambler S3 segment await timeout after recording stop",
  "Android MediaCodec audio/opus encoder failure or incomplete EOS drain",
  "InputConnection refresh or editor switch blocking commitText delivery",
  "Microphone foreground service start failure or AudioRecord error",
  "Local Whisper HTTP endpoint timeout or non-2xx response",
  "App crash or logcat rotation erasing live failure evidence before inspection",
]

[architecture]
state_owners = [
  "WhisperRecordingService owns dictation Phase state machine and active Session",
  "PendingRecordingStore owns persistent FIFO WAV queue in filesDir/pending_dictations",
  "WhisperKeyboardService owns IME viewActive state, EditorIdentity, and commitText delivery",
  "RamblerLiveSession owns rolling 180s/240s S3 segments and Ogg/Opus backup buffers",
  "DictationDiagnostics owns bounded ring buffer, async rotating JSONL writer, and snapshot state",
]
mutation_points = [
  "WhisperRecordingService.publish",
  "WhisperKeyboardService.insertTranscript",
  "PendingRecordingStore.enqueue",
  "PendingRecordingStore.delete",
  "RamblerLiveSession.Segment.runS3Loop",
]
side_effect_boundaries = [
  "WavRecording (AudioRecord + WAV file)",
  "OpusOggEncoder (Android MediaCodec audio/opus)",
  "RamblerS3Client (OkHttp HTTP/2 duplex S3Bidi)",
  "WhisperEndpoint (HttpURLConnection POST /transcribe_raw)",
  "InputMethodService.currentInputConnection.commitText",
]
fault_containment = "Active audio is promoted to filesDir/pending_dictations before network finalization; Rambler live stream errors, premature EOF, or empty live responses trigger buffered Ogg retry, and unrecovered failures remain queued for retry."

[errors]
typed_codes = "implemented_tested"
preserves_source_chain = "implemented_tested"
preserves_first_failure = "implemented_tested"
causal_ids = ["opId (rec-NNNN / retry-NNNN)", "segmentIndex (seg)", "monotonic seq"]

[invariants]
release_checks = [
  "RamblerS3Client.validateGrpcStatus rejects non-zero gRPC status trailers instead of returning empty speech",
  "RamblerLiveSession.finish fails explicitly when doneLatch.await times out instead of returning empty speech",
  "RamblerS3Client treats live premature reader EOF before end_of_data with empty text as an IOException",
  "PendingRecordingStore deletes queued WAVs only after commitText returns true or clean empty speech",
]
progress_rules = [
  "RamblerS3Client emits stream_progress heartbeat every 10s while streaming",
  "RamblerLiveSession rolls segments at 180s silence pause or 240s hard limit",
  "Auto-retry uses exponential backoff 3s..30s and stops when keyboard is hidden",
]
resource_balances = [
  "sessionsStarted vs sessionsCompleted + sessionsFailed + sessionsEmptySpeech + sessionsAborted",
  "s3CallsStarted vs s3CallsSucceeded + s3CallsFailed",
  "queueEnqueued vs queueDeleted + queueEvicted",
  "commitsAttempted vs commitsSucceeded + commitsFailed",
]

[configuration]
effective_config = "implemented_untested"
decision_provenance = "implemented_untested"
dynamic_change_history = "planned"

[build]
identity = "PackageInfo versionName/versionCode + Android release + device model emitted in process_init and snapshot JSON"
exact_artifact_retention = "planned"
symbols_and_unwind = "not_applicable"
source_retrieval = "planned"

[artifacts]
cache_identity = "not_applicable"
atomic_publication = "not_applicable"
generation_manifest = "not_applicable"

[live]
capabilities_command = "./scripts/adb-diagnose.sh -s DEVICE"
snapshot_command = "./scripts/adb-diagnose.sh -s DEVICE"
snapshot_consistency = "best-effort"
independent_of_failure_loop = "implemented_tested"
capture_timeout_ms = 2000

[history]
flight_recorder = "implemented_tested"
schema = "DictationDiagnostics JSONL schema=1 (seq, tsWallMs, tsMonoMs, level, thread, opId, cat, event, fields)"
capacity_events = 512
drop_and_overwrite_reporting = "implemented_tested"

[audit_trail]
mutation_audit = "not_applicable"
event_schema = "not_applicable"
actor_writer_and_reason = "not_applicable"
attribution_policy = "not_applicable"
transaction_binding = "not_applicable"
attempted_write_policy = "not_applicable"
provenance_and_deduplication = "not_applicable"
change_representation = "not_applicable"
direct_write_coverage = "not_applicable"
tamper_evidence = "not_applicable"
retention_and_access = "not_applicable"
query_and_export = "not_applicable"
sink_failure_policy = "not_applicable"
cost_and_backpressure = "not_applicable"
assurance_test = "not_applicable"
max_event_bytes = 0
max_added_commit_p99_ms = 0.0
max_throughput_regression_percent = 0.0
max_audit_wait_ms = 0
max_storage_bytes_per_day = 0

[concurrency]
task_registry = "waived"
lock_wait_introspection = "not_applicable"
cross_process_correlation = "not_applicable"

[resources]
ownership_reporting = "implemented_untested"
declared_budgets = [
  "PendingRecordingStore max 20 files / 50 MiB",
  "DiagnosticFlightRecorder ring 512 events / disk 512 KiB rotating JSONL",
]
high_water_reporting = "planned"

[reproduction]
recorded_inputs = [
  "Failed dictation WAV clips preserved in filesDir/pending_dictations",
  "Rolling single-file last_delivered.wav (<= 10 MiB) retained in filesDir/diagnostics for post-delivery cutoff replay",
]
replay_command = "./scripts/adb-diagnose.sh -s DEVICE --pull-audio /tmp/last.wav (or Retry button for failed clips)"
fault_injection = ["Synthetic gRPC status validation and editor target mismatch in DictationDiagnosticsTest"]

[postmortem]
crash_capture = "implemented_tested"
includes_history = "implemented_tested"
oom_or_external_kill_detection = "planned"
retention_policy = "Rotating events.jsonl + events.1.jsonl (256 KiB each, 512 KiB cap) plus atomic last_snapshot.json and last_crash.json in private filesDir/diagnostics"

[recovery]
pre_repair_evidence = "implemented_untested"
restart_or_fallback_history = "implemented_untested"
last_failure_retention = "implemented_tested"

[domain]
state_dump = "Atomic last_snapshot.json on disk plus WhisperRecordingService, WhisperKeyboardService, and SwiftKeyBridgeService dump() output"
cross_boundary_ids = ["opId", "seg"]

[security]
authorization = "Android app-private internal storage (filesDir/diagnostics) accessible only to app UI or ADB run-as/dumpsys"
redaction = [
  "Forbidden keys (transcript, text, hypothesis, partial, final, api_key, authorization, password, secret, token, cookie)",
  "Regex redaction of Google API keys (AIza...), bearer/secret key-value pairs, and URL userinfo credentials",
]
max_bundle_bytes = 524288
retention_days = 7

[budgets]
measurement_status = "planned"
steady_cpu_percent = 0.2
steady_memory_bytes = 524288
activated_cpu_percent = 0.5

[deployment_modes]
minimal_release = "not_applicable"
observable_release = "app:assembleDebug and app:assembleRelease include bounded always-on DictationDiagnostics baseline"
global_runtime_switch = "DictationDiagnostics.setEnabled(Boolean)"
per_category_switches = ["DictationDiagnostics.setCategoryEnabled(category, Boolean) for lifecycle, state, audio, encoder, s3, whisper, queue, ime, error"]
diagnostic_builds = ["app:assembleDebug"]
optional_diagnostics_default_enabled = false
lazy_buffer_allocation = true
lazy_helper_start = true

[performance_isolation]
preserves_release_optimization = true
compile_time_exclusion_supported = false
critical_hot_paths = ["WavRecording.record PCM capture loop", "OpusOggEncoder.writePcm"]
disabled_hot_path_extra_instructions = 0
baseline_comparison = "No per-PCM-chunk or per-Opus-packet logging; only atomic counters updated on hot paths"
minimal_mode_test = "not_applicable"
runtime_disabled_test = "DictationDiagnosticsTest.runtimeDisableAndCategorySwitchesSkipRecordingAndDiskWrites"
always_on_test = "DictationDiagnosticsTest"
activated_mode_tests = ["not_applicable"]

[artifact_isolation]
single_semantic_source = true
release_minimal_erasure = "not_applicable"
release_minimal_runtime_diagnostic_checks = 0
semantic_source_and_generation = "Single Kotlin source set under app/src/main"
performance_closure = ["WavRecording.record", "OpusOggEncoder.writePcm"]
assurance_artifacts = ["app/build/outputs/apk/debug/app-debug.apk"]
release_minimal_postimages = ["not_applicable"]
permitted_release_facilities = ["DictationDiagnostics always-on bounded ring + rotating JSONL"]
forbidden_release_markers = ["not_applicable"]
postimage_absence_test = "not_applicable"
runtime_check_absence_test = "not_applicable"
dependency_absence_test = "not_applicable"
semantic_equivalence_test = "not_applicable"
artifact_provenance_test = "not_applicable"

[instrumentation_policy]
facility_admission = "required"
default_class = "always_on"
max_steady_cpu_percent = 0.5
max_steady_memory_bytes = 1048576
max_event_rate_per_second = 50
max_disk_bytes_per_day = 524288
max_snapshot_pause_ms = 50
max_activation_ttl_seconds = 300
max_activated_capture_bytes = 524288
max_minimal_cpu_regression_percent = 0.0
max_runtime_disabled_cpu_regression_percent = 0.1
max_steady_p99_latency_regression_percent = 1.0
max_activated_cpu_percent = 2.0
synchronous_hot_path_io = false
global_contended_event_index = false
require_overhead_test = true
promotion_requires_measurement = true

[assurance]
contract_test = "DictationDiagnosticsTest"
synthetic_scenarios = [
  "ring_overflow_and_overwrite_accounting",
  "jsonl_rotation_and_persisted_tail",
  "canary_secret_and_transcript_redaction",
  "first_error_preservation_and_cause_chain",
  "grpc_trailer_status_validation",
  "refreshed_input_connection_editor_identity",
  "dumpsys_snapshot_and_events_dump",
]
symbolization_test = "not_applicable"
redaction_test = "DictationDiagnosticsTest.redactsCanarySecretsAndForbiddenTranscriptFields"
overhead_test = "waived"
snapshot_test = "DictationDiagnosticsTest.dumpToWriterEmitsSnapshotJsonAndRecentEvents"

[exceptions]
items = [
  { control = "build.symbols_and_unwind", disposition = "not_applicable", reason = "Pure Kotlin/ART Android APK with no native JNI/NDK code or custom unwinder" },
  { control = "artifacts.cache_identity", disposition = "not_applicable", reason = "No derived artifact or memoization cache persisted across sessions" },
  { control = "artifacts.atomic_publication", disposition = "not_applicable", reason = "No multi-file/table atomic dataset publication; single WAV rename in PendingRecordingStore" },
  { control = "artifacts.generation_manifest", disposition = "not_applicable", reason = "No multi-file generated asset bundles" },
  { control = "audit_trail.mutation_audit", disposition = "not_applicable", reason = "Personal single-user IME with disposable transient audio recordings and no regulated or shared persistent ledger" },
  { control = "audit_trail.direct_write_coverage", disposition = "not_applicable", reason = "No database or durable audited ledger" },
  { control = "concurrency.task_registry", disposition = "waived", reason = "Small fixed set of named threads (voice-kb-worker, voice-kb-diag-writer, per-segment encoder/S3) tracked via activeSegmentSummary and opId" },
  { control = "concurrency.lock_wait_introspection", disposition = "not_applicable", reason = "Single-thread worker executor and short lock-free atomic snapshots; no complex lock hierarchy" },
  { control = "concurrency.cross_process_correlation", disposition = "not_applicable", reason = "Single-process Android IME application" },
  { control = "artifact_isolation.release_minimal_erasure", disposition = "not_applicable", reason = "Personal sideloaded APK ships only the bounded always-on baseline; no separate stripped release-minimal tier" },
]

